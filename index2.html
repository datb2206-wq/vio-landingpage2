<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vio Agency</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
/* CHANGE THE PALETTE HERE: ink = dark backgrounds, neon = main accent, glow = secondary accent */
tailwind.config = { theme: { extend: { colors: {
  ink: { 900:'#061a3a', 950:'#020a1c' },
  neon: { 400:'#38bdf8', 500:'#0ea5e9', 600:'#0284c7' },
  glow: { 400:'#67e8f9', 500:'#06b6d4' }
}}}}
</script>
<style>
  @keyframes float { 0%,100% { translate: 0 0 } 50% { translate: 0 -14px } }
  .animate-float { animation: float 6s ease-in-out infinite; }
  .card-3d { transform: perspective(1100px) rotateY(-14deg) rotateX(6deg); }
</style>
</head>
<body class="bg-ink-950 text-slate-300 font-sans antialiased overflow-x-hidden">

<!-- ========== HEADER ========== -->
<header class="sticky top-0 z-50 bg-ink-950/80 backdrop-blur border-b border-white/10">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <a href="#" class="flex items-center gap-2 text-lg font-extrabold text-white">
      <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-neon-500 to-glow-500 grid place-items-center">V</span>
      Vio Agency
    </a>

    <nav class="hidden lg:flex gap-7 text-sm">
      <a href="#services" data-i18n="nav1" class="hover:text-neon-400"></a>
      <a href="#benefits" data-i18n="nav2" class="hover:text-neon-400"></a>
      <a href="#pricing" data-i18n="nav3" class="hover:text-neon-400"></a>
      <a href="#contact" data-i18n="nav4" class="hover:text-neon-400"></a>
    </nav>

    <div class="flex items-center gap-3">
      <!-- Language switcher -->
      <div class="flex rounded-full border border-white/15 p-0.5 text-xs font-semibold">
        <button data-lang="en" class="lang-btn px-3 py-1 rounded-full">EN</button>
        <button data-lang="zh" class="lang-btn px-3 py-1 rounded-full">中文</button>
        <button data-lang="ru" class="lang-btn px-3 py-1 rounded-full">RU</button>
      </div>
      <a href="https://t.me/" data-i18n="tg" class="hidden sm:inline-block bg-gradient-to-r from-neon-600 to-glow-500 hover:opacity-90 text-white text-sm font-semibold px-5 py-2.5 rounded-full shadow-lg shadow-neon-600/30"></a>
    </div>
  </div>
</header>

<!-- ========== HERO ========== -->
<section class="relative">
  <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-neon-600/30 blur-3xl"></div>
  <div class="absolute top-40 right-0 w-96 h-96 rounded-full bg-glow-500/20 blur-3xl"></div>

  <div class="relative max-w-6xl mx-auto px-4 py-16 md:py-24 grid lg:grid-cols-2 gap-14 items-center">
    <div>
      <span class="inline-block text-xs font-bold tracking-wider text-neon-400 border border-neon-500/40 bg-neon-500/10 rounded-full px-4 py-1.5 mb-5">META · GOOGLE · TIKTOK ADS</span>
      <h1 class="text-4xl md:text-6xl font-extrabold leading-tight text-white">
        <span data-i18n="h1a"></span><br>
        <span data-i18n="h1b" class="bg-gradient-to-r from-neon-400 to-glow-400 bg-clip-text text-transparent"></span>
      </h1>
      <p data-i18n="sub" class="mt-6 text-lg text-slate-400 max-w-xl"></p>

      <div class="mt-8 flex flex-wrap gap-3">
        <a href="https://t.me/" data-i18n="cta1" class="bg-gradient-to-r from-neon-600 to-glow-500 text-white font-semibold px-8 py-3.5 rounded-full shadow-xl shadow-neon-600/40 hover:scale-105 transition"></a>
        <a href="#pricing" data-i18n="cta2" class="border border-neon-500/50 text-neon-400 hover:bg-neon-500/10 font-semibold px-8 py-3.5 rounded-full"></a>
      </div>

      <!-- Key stats -->
      <div class="mt-12 grid grid-cols-3 gap-3 max-w-lg">
        <div class="rounded-2xl bg-white/5 border border-white/10 p-4">
          <p class="text-2xl font-extrabold text-white">2%</p><p data-i18n="st1" class="text-xs mt-1 text-slate-400"></p>
        </div>
        <div class="rounded-2xl bg-white/5 border border-white/10 p-4">
          <p class="text-2xl font-extrabold text-white">10%</p><p data-i18n="st2" class="text-xs mt-1 text-slate-400"></p>
        </div>
        <div class="rounded-2xl bg-white/5 border border-white/10 p-4">
          <p class="text-2xl font-extrabold text-white">∞</p><p data-i18n="st3" class="text-xs mt-1 text-slate-400"></p>
        </div>
      </div>
    </div>

    <!-- 3D card illustration (replace with <img> if you have a real render) -->
    <div class="relative h-[26rem] grid place-items-center">
      <div class="absolute w-72 h-72 rounded-full bg-neon-500/30 blur-3xl"></div>
      <div class="card-3d animate-float relative w-72 sm:w-80">
        <div class="absolute inset-0 translate-x-6 translate-y-6 rounded-3xl bg-glow-500/30 border border-glow-400/30"></div>
        <div class="absolute inset-0 translate-x-3 translate-y-3 rounded-3xl bg-neon-600/40 border border-neon-400/30"></div>
        <div class="relative rounded-3xl bg-gradient-to-br from-ink-900 to-neon-600/60 border border-neon-400/50 p-6 shadow-2xl shadow-neon-600/40">
          <div class="flex justify-between items-center">
            <span class="font-extrabold text-white">Vio Ads</span>
            <span class="text-[10px] px-2 py-1 rounded-full bg-emerald-400/20 text-emerald-300">● LIVE</span>
          </div>
          <p data-i18n="cardBal" class="mt-8 text-xs text-slate-300"></p>
          <p class="text-3xl font-extrabold text-white tracking-wide">$ 25,480</p>
          <div class="mt-5 flex items-end gap-1.5 h-14">
            <div class="flex-1 rounded-t bg-neon-400/40 h-1/3"></div><div class="flex-1 rounded-t bg-neon-400/60 h-1/2"></div>
            <div class="flex-1 rounded-t bg-neon-400/60 h-2/5"></div><div class="flex-1 rounded-t bg-neon-400 h-3/4"></div>
            <div class="flex-1 rounded-t bg-glow-400 h-full"></div>
          </div>
          <div class="mt-5 flex justify-between text-xs">
            <span data-i18n="cardAuto" class="text-neon-400"></span>
            <span class="text-glow-400 font-semibold"><span data-i18n="cardCb"></span> +10%</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ========== PLATFORMS ========== -->
<section id="services" class="py-12 border-y border-white/10 bg-ink-900/60">
  <div class="max-w-6xl mx-auto px-4 flex flex-wrap justify-center gap-4 sm:gap-10 text-lg font-bold text-slate-400">
    <span class="px-6 py-2 rounded-full border border-white/10">Meta / Facebook Ads</span>
    <span class="px-6 py-2 rounded-full border border-white/10">Google Ads</span>
    <span class="px-6 py-2 rounded-full border border-white/10">TikTok Ads</span>
  </div>
</section>
<span id="benefits"></span><span id="pricing"></span>

<!-- ========== FOOTER ========== -->
<footer id="contact" class="py-8 text-center text-xs text-slate-500">
  <a href="https://t.me/" class="text-neon-400 font-semibold">@vioagency</a><br>
  <span class="inline-block mt-2">© 2026 Vio Agency. <span data-i18n="rights"></span></span>
</footer>

<!-- ========== LANGUAGE SWITCHER (EN / 中文 / RU) ========== -->
<script>
const I18N = {
  en: { nav1:'Services', nav2:'Benefits', nav3:'Pricing', nav4:'Contact', tg:'Message on Telegram',
    h1a:'Ad account rental', h1b:'no bans, no limits',
    sub:'Run Meta, Google and TikTok ads on reliable accounts with auto top-up, cashback and 24/7 support.',
    cta1:'Get started', cta2:'View pricing', st1:'Fee from', st2:'Max cashback', st3:'Uncapped limit',
    cardBal:'Balance', cardAuto:'Auto top-up on', cardCb:'Cashback', rights:'All rights reserved.' },
  zh: { nav1:'服务', nav2:'优势', nav3:'费率', nav4:'联系我们', tg:'Telegram 联系我们',
    h1a:'广告账户租赁', h1b:'无封号，无限额',
    sub:'通过稳定的账户投放 Meta、Google 和 TikTok 广告，支持自动充值、返现和 24/7 技术支持。',
    cta1:'立即开始', cta2:'查看费率', st1:'手续费低至', st2:'最高返现', st3:'无上限额度',
    cardBal:'余额', cardAuto:'自动充值已开启', cardCb:'返现', rights:'版权所有。' },
  ru: { nav1:'Услуги', nav2:'Преимущества', nav3:'Тарифы', nav4:'Контакты', tg:'Написать в Telegram',
    h1a:'Аренда рекламных аккаунтов', h1b:'без банов и лимитов',
    sub:'Запускайте рекламу в Meta, Google и TikTok на надёжных аккаунтах с автопополнением, кэшбэком и поддержкой 24/7.',
    cta1:'Начать сейчас', cta2:'Тарифы', st1:'Комиссия от', st2:'Макс. кэшбэк', st3:'Без лимита',
    cardBal:'Баланс', cardAuto:'Автопополнение вкл.', cardCb:'Кэшбэк', rights:'Все права защищены.' }
};
function setLang(l) {
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = I18N[l][el.dataset.i18n]);
  document.querySelectorAll('.lang-btn').forEach(b => {
    const on = b.dataset.lang === l;
    b.classList.toggle('bg-neon-600', on); b.classList.toggle('text-white', on);
  });
  try { localStorage.setItem('lang', l); } catch (e) {}
}
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
let saved = 'ru'; try { saved = localStorage.getItem('lang') || 'ru'; } catch (e) {}
setLang(I18N[saved] ? saved : 'ru');   // default language: 'ru' (change to 'en' if preferred)
</script>
</body>
</html>
